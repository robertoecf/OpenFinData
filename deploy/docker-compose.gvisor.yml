# gVisor-hardened openfindata deploy.
# Never attach this service to hermes/wealthuman networks.
# Code mode must stay off (do not set FINDATA_MCP_CODE_MODE).
# Requires Docker runtime runsc (gVisor).
services:
  openfindata:
    build:
      context: ..
      dockerfile: Dockerfile
    image: openfindata:latest
    container_name: openfindata
    runtime: runsc
    restart: unless-stopped
    ports:
      # Loopback + Tailscale CGNAT only. Never 0.0.0.0.
      # Validate first: python3 deploy/assert_tailscale_bind.py
      - "127.0.0.1:8000:8000"
      - "${TAILSCALE_IP:-100.90.45.18}:8000:8000"
    # gVisor does not reliably use Docker's 127.0.0.11 stub DNS.
    # Mount a resolv.conf that points straight at public resolvers.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./resolv.gvisor.conf:/etc/resolv.conf:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    user: "65534:65534"
    pids_limit: 256
    # Image HEALTHCHECK hits /health and can 429 under rate limit; keep off.
    healthcheck:
      disable: true
    environment:
      FINDATA_RATE_LIMIT_ENABLED: "true"
      FINDATA_RATE_LIMIT_DEFAULT: "60/minute;1000/day"
      # Explicitly off — do not override via .env on public VPS.
      FINDATA_MCP_CODE_MODE: "0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - openfindata_net

networks:
  openfindata_net:
    driver: bridge
